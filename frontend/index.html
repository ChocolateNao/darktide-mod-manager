<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Darktide Mod Manager</title>
    <script>
      // Runs before first paint to avoid flash of default theme.
      (() => {
        try {
          const raw = window.localStorage.getItem("dmm.ui.v1");
          const cached = raw ? JSON.parse(raw)?.state : undefined;
          const theme = cached?.theme ?? "dark";
          const resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.compact = String(cached?.compact === true);
        } catch {
          // Dark is the default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="./src/main.tsx" type="module"></script>
  </body>
</html>
